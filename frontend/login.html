<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — 3SPADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="navbar">
    <a class="brand" href="home.html">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L34 18 C38 22 36 30 28 31 C25 31.4 22.5 30 21 28 L21 34 L25 34 L25 37 L15 37 L15 34 L19 34 L19 28 C17.5 30 15 31.4 12 31 C4 30 2 22 6 18 Z" fill="#ff2e4d"/>
      </svg>
      <span class="brand-name">3<span>SPADA</span></span>
    </a>
    <nav class="menu" id="menu">
      <a href="home.html">Home</a>
      <a href="team.html">Team</a>
      <a href="about.html">About Us</a>
      <a href="login.html" class="active cta-link">Login</a>
    </nav>
    <button class="burger" id="burger" aria-label="Buka menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="section-num">Masuk</div>
    <h2 style="margin-top:8px; font-size:32px;">Login Anggota</h2>
    <p style="margin-top:8px; font-size:14px;">Akses absensi latihan dan statistik pertandinganmu.</p>

    <form id="login-form" style="margin-top:24px;">
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Login</button>
      <div class="form-msg" id="login-msg"></div>
    </form>

    <div class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
