<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — 3SPADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <div class="navbar">
    <a class="brand" href="../">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L34 18 C38 22 36 30 28 31 C25 31.4 22.5 30 21 28 L21 34 L25 34 L25 37 L15 37 L15 34 L19 34 L19 28 C17.5 30 15 31.4 12 31 C4 30 2 22 6 18 Z" fill="#ff2e4d"/>
      </svg>
      <span class="brand-name">3<span>SPADA</span></span>
    </a>
    <nav class="menu" id="menu">
      <a href="../">Home</a>
      <a href="../team/">Team</a>
      <a href="../about/">About Us</a>
      <a href="../login/" class="cta-link">Login</a>
    </nav>
    <button class="burger" id="burger" aria-label="Buka menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="section-num">Registrasi</div>
    <h2 style="margin-top:8px; font-size:32px;">Gabung 3SPADA</h2>
    <p style="margin-top:8px; font-size:14px;">Untuk pemain dan staf yang sudah diterima ke tim.</p>

    <form id="register-form" style="margin-top:24px;">
      <div class="field">
        <label for="reg-name">Nama Lengkap</label>
        <input type="text" id="reg-name" required>
      </div>
      <div class="field">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="reg-type">Status</label>
        <select id="reg-type">
          <option value="player">Player</option>
          <option value="staff">Staff</option>
        </select>
      </div>
      <div class="field">
        <label for="reg-ign">In-Game Name (IGN)</label>
        <input type="text" id="reg-ign" placeholder="Contoh: rzky.exp">
      </div>
      <div class="field">
        <label for="reg-role">Role di Game</label>
        <input type="text" id="reg-role" placeholder="Contoh: EXP Laner, Coach, Manager">
      </div>
      <button type="submit" class="btn-primary">Daftar</button>
      <div class="form-msg" id="register-msg"></div>
    </form>

    <div class="auth-switch">Sudah punya akun? <a href="../login/">Login di sini</a></div>
  </div>
</div>

<script src="../js/anti-inspect.js"></script>
<script src="../js/config.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
